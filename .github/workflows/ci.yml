name: Debug APK

on:
  push:
    branches: [ main, arena/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"

          JAVA_MAJOR=$(java -version 2>&1 \
            | awk -F '"' '/version/ {print $2}' \
            | awk -F. '{print ($1 == "1" ? $2 : $1)}')

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java 17 or newer is required; detected: ${JAVA_MAJOR:-unknown}"
            exit 1
          fi

          echo "Java $JAVA_MAJOR is valid"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Set up Gradle 9.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.1"

      - name: Fix gradlew permissions and line endings
        shell: bash
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Create temporary debug keystore
        shell: bash
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists"
          else
            echo "Generating debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: debug.keystore could not be created"
            exit 1
          fi
          echo "debug.keystore is ready"

      - name: Build debug APK
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK found at $APK_PATH"
          else
            echo "Error: APK not found at $APK_PATH"
            echo "Searching for APK files in app/build/outputs/apk..."
            find app/build/outputs/apk -name "*.apk" -type f
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vitacut-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
